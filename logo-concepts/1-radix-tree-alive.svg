<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="480" height="480">
  <defs>
    <!-- soft radial glow behind the tree -->
    <radialGradient id="atmosphere" cx="50%" cy="58%" r="60%">
      <stop offset="0%" stop-color="#6c8aff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#6c8aff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6c8aff" stop-opacity="0"/>
    </radialGradient>

    <!-- stem gradient: darker at root, brighter at tips (growth energy moves up) -->
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d4f85"/>
      <stop offset="40%" stop-color="#5a75d9"/>
      <stop offset="100%" stop-color="#b4c4ff"/>
    </linearGradient>

    <!-- bloom filter for luminous nodes -->
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- motion paths for rising thought-particles -->
    <path id="riseLeft" d="M100 172 L100 124 L68 100 L44 68 L36 44" fill="none"/>
    <path id="riseRight" d="M100 172 L100 124 L132 100 L156 68 L164 44" fill="none"/>
    <path id="riseMidLeft" d="M100 172 L100 124 L68 100 L80 68" fill="none"/>
    <path id="riseMidRight" d="M100 172 L100 124 L132 100 L120 68" fill="none"/>
  </defs>

  <!-- dark backdrop (remove this rect if embedding over an existing themed bg) -->
  <rect width="200" height="200" fill="#111118"/>
  <rect width="200" height="200" fill="url(#atmosphere)"/>

  <!-- ============ TREE BRANCHES (growth-on-load, tapered, gradient) ============ -->
  <g stroke="url(#stem)" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="100">
    <!-- trunk -->
    <path d="M100 172 L100 124" stroke-width="5" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.3s" fill="freeze"/>
    </path>
    <!-- level 1: first split -->
    <path d="M100 124 L68 100" stroke-width="3.6" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="0.9s" fill="freeze"/>
    </path>
    <path d="M100 124 L132 100" stroke-width="3.6" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="0.9s" fill="freeze"/>
    </path>
    <!-- level 2: inner terminals (these end in a leaf) -->
    <path d="M68 100 L80 68" stroke-width="2.3" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="1.3s" fill="freeze"/>
    </path>
    <path d="M132 100 L120 68" stroke-width="2.3" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="1.3s" fill="freeze"/>
    </path>
    <!-- level 2: outer branches (continue to deeper split) -->
    <path d="M68 100 L44 68" stroke-width="2.6" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="1.3s" fill="freeze"/>
    </path>
    <path d="M132 100 L156 68" stroke-width="2.6" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.4s" begin="1.3s" fill="freeze"/>
    </path>
    <!-- level 3: deepest twigs -->
    <path d="M44 68 L36 44" stroke-width="1.7" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.35s" begin="1.7s" fill="freeze"/>
    </path>
    <path d="M44 68 L52 44" stroke-width="1.7" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.35s" begin="1.7s" fill="freeze"/>
    </path>
    <path d="M156 68 L148 44" stroke-width="1.7" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.35s" begin="1.7s" fill="freeze"/>
    </path>
    <path d="M156 68 L164 44" stroke-width="1.7" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.35s" begin="1.7s" fill="freeze"/>
    </path>
  </g>

  <!-- ============ LEAF NODES (bloom + breathing, staggered) ============ -->
  <g filter="url(#bloom)" fill="#c0d0ff">
    <!-- deep leaves (fade in after twigs complete) -->
    <circle cx="36" cy="44" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="2.05s" fill="freeze"/>
      <animate attributeName="r" values="2.4;3.2;2.4" dur="4s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="44" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="2.05s" fill="freeze"/>
      <animate attributeName="r" values="2.4;3.2;2.4" dur="4s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="44" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="2.05s" fill="freeze"/>
      <animate attributeName="r" values="2.4;3.2;2.4" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="44" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="2.05s" fill="freeze"/>
      <animate attributeName="r" values="2.4;3.2;2.4" dur="4s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- mid-level leaves (inner terminals) -->
    <circle cx="80" cy="68" r="2.1" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="1.7s" fill="freeze"/>
      <animate attributeName="r" values="2.1;2.8;2.1" dur="4s" begin="3.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="68" r="2.1" opacity="0">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.5s" begin="1.7s" fill="freeze"/>
      <animate attributeName="r" values="2.1;2.8;2.1" dur="4s" begin="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ SEED (glowing heartbeat at the base) ============ -->
  <circle cx="100" cy="172" r="4" fill="#6c8aff" filter="url(#bloom)">
    <animate attributeName="r" values="4;4.9;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- expanding heartbeat ring pulsing outward from the seed -->
  <circle cx="100" cy="172" r="4" fill="none" stroke="#6c8aff" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="4;22" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.2;0.2" dur="3s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ RISING THOUGHT-PARTICLES (data flowing upward) ============ -->
  <circle r="1.3" fill="#d8e0ff" opacity="0" filter="url(#bloom)">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" begin="3s" repeatCount="indefinite"/>
    <animateMotion dur="5s" begin="3s" repeatCount="indefinite">
      <mpath href="#riseLeft"/>
    </animateMotion>
  </circle>
  <circle r="1.3" fill="#d8e0ff" opacity="0" filter="url(#bloom)">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" begin="5.5s" repeatCount="indefinite"/>
    <animateMotion dur="5s" begin="5.5s" repeatCount="indefinite">
      <mpath href="#riseRight"/>
    </animateMotion>
  </circle>
  <circle r="1.1" fill="#d8e0ff" opacity="0" filter="url(#bloom)">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="6s" begin="7.5s" repeatCount="indefinite"/>
    <animateMotion dur="6s" begin="7.5s" repeatCount="indefinite">
      <mpath href="#riseMidRight"/>
    </animateMotion>
  </circle>
  <circle r="1.1" fill="#d8e0ff" opacity="0" filter="url(#bloom)">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="6s" begin="9s" repeatCount="indefinite"/>
    <animateMotion dur="6s" begin="9s" repeatCount="indefinite">
      <mpath href="#riseMidLeft"/>
    </animateMotion>
  </circle>
</svg>
