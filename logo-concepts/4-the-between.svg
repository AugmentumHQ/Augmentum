<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <rect width="100" height="100" fill="#111118"/>
  <!-- frontend plane (top) -->
  <rect x="18" y="20" width="64" height="6" rx="1.5" fill="#6c8aff" opacity="0.28"/>
  <!-- backend plane (bottom) -->
  <rect x="18" y="74" width="64" height="6" rx="1.5" fill="#6c8aff" opacity="0.28"/>
  <!-- the intelligence layer growing in the gap -->
  <g fill="none" stroke="#6c8aff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M 50 74 L 50 30"/>
    <!-- right leaf -->
    <path d="M 50 54 C 60 50, 64 42, 64 34"/>
    <!-- left leaf -->
    <path d="M 50 60 C 40 56, 36 48, 36 40"/>
  </g>
  <!-- bud at apex, breaking the top plane -->
  <circle cx="50" cy="26" r="3.2" fill="#6c8aff"/>
  <!-- subtle connector dots showing traffic flow -->
  <circle cx="30" cy="23" r="1" fill="#6c8aff" opacity="0.5"/>
  <circle cx="70" cy="23" r="1" fill="#6c8aff" opacity="0.5"/>
  <circle cx="30" cy="77" r="1" fill="#6c8aff" opacity="0.5"/>
  <circle cx="70" cy="77" r="1" fill="#6c8aff" opacity="0.5"/>
</svg>
