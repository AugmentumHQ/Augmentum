<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <rect width="100" height="100" fill="#111118"/>
  <g fill="none" stroke="#6c8aff" stroke-linecap="round" stroke-linejoin="round">
    <!-- ARCHIVE (outermost) -->
    <path d="M 18 72 A 32 32 0 0 1 82 72" stroke-width="2" opacity="0.4"/>
    <!-- LEDGER (middle) -->
    <path d="M 28 72 A 22 22 0 0 1 72 72" stroke-width="2" opacity="0.7"/>
    <!-- STATE (innermost) -->
    <path d="M 38 72 A 12 12 0 0 1 62 72" stroke-width="2"/>
    <!-- ground line -->
    <path d="M 16 72 L 84 72" stroke-width="1" opacity="0.3"/>
    <!-- sprout stem -->
    <path d="M 50 72 L 50 30" stroke-width="2.2"/>
    <!-- right leaf -->
    <path d="M 50 50 C 58 48, 62 42, 62 34" stroke-width="2"/>
    <!-- left leaf -->
    <path d="M 50 56 C 42 54, 38 48, 38 40" stroke-width="2"/>
    <!-- apex node -->
