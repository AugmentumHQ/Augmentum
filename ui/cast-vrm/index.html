<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Augmentum Companion</title>
  <!-- three-vrm and GLTFLoader emit bare `import … from "three"`
       specifiers internally — without this map the browser can't
       resolve them and the surface boot fails. Cast surfaces are
       loaded as standalone iframes, so the main UI's importmap
       doesn't apply here. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/ui/lib/three/three.module.min.js"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #stage { position: fixed; inset: 0; }
    #fallback {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #555; font: 14px/1.4 system-ui, sans-serif;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    #fallback.err { color: #c44; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div id="fallback">Loading companion…</div>
  <script type="module" src="cast-vrm.js"></script>
</body>
</html>
