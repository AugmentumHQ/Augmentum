<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cast TV Demo Surface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1d24, #2a2d36);
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    main {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 64px;
      gap: 32px;
    }
    h1 { font-size: 56px; letter-spacing: 0.02em; }
    .badge {
      display: inline-block;
      background: rgba(122, 134, 255, 0.18);
      color: #b1baff;
      border: 1px solid rgba(122, 134, 255, 0.35);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .field {
      display: flex;
      gap: 16px;
      font-size: 24px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .field-label { color: #888; min-width: 140px; }
    .field-value {
      color: #f0f0f0;
      max-width: 60vw;
      overflow-wrap: anywhere;
    }
    pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 18px;
      border-radius: 12px;
      max-width: 80vw;
      max-height: 30vh;
      overflow: auto;
      font-size: 18px;
      line-height: 1.4;
    }
    .pulse {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #5cd573;
      box-shadow: 0 0 12px #5cd573;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Cast TV Demo Surface</div>
    <h1 data-demo-title>Waiting for init…</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="pulse" id="pulse" style="display:none"></div>
      <span data-demo-status style="font-size:18px;color:#888"></span>
    </div>
    <div class="field"><div class="field-label">Surface ID</div><div class="field-value" data-demo-sid>—</div></div>
    <div class="field"><div class="field-label">Kind</div><div class="field-value" data-demo-kind>—</div></div>
    <div class="field"><div class="field-label">Slot</div><div class="field-value" data-demo-slot>—</div></div>
    <pre data-demo-state>{}</pre>
    <div style="font-size:16px;color:#666">Latest patch count: <span data-demo-patch-count>0</span></div>
  </main>
  <script type="module" src="cast-tv-demo.js"></script>
</body>
</html>
