<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Pose Harness</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a10;
      color: #edf2ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: stretch;
      background:
        radial-gradient(circle at 50% 28%, rgba(130, 160, 210, 0.14), transparent 34%),
        linear-gradient(180deg, #0e1320 0%, #080a10 58%, #050609 100%);
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #avatar-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32%;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(transparent, rgba(0, 0, 0, 0.7) 26%, black);
      opacity: 0.45;
      transform: perspective(600px) rotateX(62deg);
      transform-origin: bottom center;
    }

    #hud {
      position: absolute;
      left: 18px;
      top: 18px;
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      background: rgba(7, 9, 14, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(237, 242, 255, 0.86);
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: 0;
      pointer-events: none;
      min-width: 220px;
    }

    #hud strong {
      color: white;
      font-weight: 650;
    }

    #hud .muted {
      color: rgba(237, 242, 255, 0.55);
    }

    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(237, 242, 255, 0.72);
      font-size: 13px;
      letter-spacing: 0;
      background: rgba(5, 6, 9, 0.42);
      transition: opacity 0.24s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <main id="stage" aria-label="Avatar pose harness">
    <canvas id="avatar-canvas"></canvas>
    <div id="floor"></div>
    <div id="hud">
      <div><strong>Avatar pose harness</strong></div>
      <div id="avatar-name" class="muted">vance.vrm</div>
      <div>Time: <span id="time-readout">0.0s</span></div>
      <div>Emotion: <span id="emotion-readout">neutral</span></div>
      <div>Gesture: <span id="gesture-readout">none</span></div>
      <div class="muted">Full-body idle framing</div>
    </div>
    <div id="loading">Loading avatar...</div>
  </main>

  <script type="module">
    import * as THREE from './lib/three/three.module.min.js';
    import { GLTFLoader } from './lib/three/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from './lib/three-vrm/three-vrm.module.min.js';
    import { AvatarAnimator } from './scripts/avatar-animator.js';
    import { PresenceEngine } from './scripts/avatar-presence.js';

    const params = new URLSearchParams(window.location.search);
    const avatarFile = params.get('avatar') || 'vance.vrm';
    const avatarUrl = `./lib/bundled-avatars/${encodeURIComponent(avatarFile)}`;
    const canvas = document.getElementById('avatar-canvas');
    const stage = document.getElementById('stage');
    const loading = document.getElementById('loading');
    const avatarName = document.getElementById('avatar-name');
    const timeReadout = document.getElementById('time-readout');
    const emotionReadout = document.getElementById('emotion-readout');
    const gestureReadout = document.getElementById('gesture-readout');

    avatarName.textContent = avatarFile;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      preserveDrawingBuffer: true,
    });

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    const keyLight = new THREE.DirectionalLight(0xfff4df, 1.15);
    keyLight.position.set(1.2, 1.8, -1.4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xdce8ff, 0.45);
    fillLight.position.set(-1.4, 1.1, -0.6);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffe6c8, 0.7);
    rimLight.position.set(0, 1.0, 1.4);
    scene.add(rimLight);

    scene.add(new THREE.AmbientLight(0xffffff, 0.2));

    let vrm = null;
    let animator = null;
    let presence = null;
    let lastT = performance.now();
    let elapsed = 0;
    let frameId = 0;
    let lastGesture = 'none';
    let framing = null;

    window.__avatarPoseHarness = {
      ready: false,
      stats: {
        elapsed: 0,
        emotion: 'neutral',
        gesture: 'none',
        avatarFile,
      },
    };

    function resize() {
      const w = Math.max(1, stage.clientWidth);
      const h = Math.max(1, stage.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (framing) applyFullBodyFrame(framing.box);
    }

    function applyFullBodyFrame(box) {
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const aspect = Math.max(0.1, camera.aspect || 1);
      const fitHeight = Math.max(size.y * 1.12, (size.x / aspect) * 1.22);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const dist = (fitHeight / 2) / Math.tan(fov / 2);

      camera.position.set(center.x, center.y + size.y * 0.03, center.z - dist * 1.08);
      camera.lookAt(center.x, center.y + size.y * 0.06, center.z);
      camera.updateProjectionMatrix();
    }

    async function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      return await new Promise((resolve, reject) => {
        loader.load(
          url,
          (gltf) => {
            const loaded = gltf.userData.vrm;
            if (!loaded) {
              reject(new Error('No VRM data found in GLTF'));
              return;
            }
            try { VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch {}
            try { VRMUtils.removeUnnecessaryJoints(gltf.scene); } catch {}
            try { loaded.humanoid?.resetNormalizedPose?.(); } catch {}
            try {
              loaded.scene.updateMatrixWorld(true);
              if (hasMirroredArmAxis(loaded)) loaded.scene.rotation.y = Math.PI;
            } catch {}
            resolve(loaded);
          },
          undefined,
          reject,
        );
      });
    }

    function hasMirroredArmAxis(loaded) {
      const humanoid = loaded.humanoid;
      if (!humanoid) return false;
      const leftUpper = humanoid.getNormalizedBoneNode?.('leftUpperArm')
        || humanoid.getRawBoneNode?.('leftUpperArm');
      const leftLower = humanoid.getNormalizedBoneNode?.('leftLowerArm')
        || humanoid.getRawBoneNode?.('leftLowerArm');
      const rightUpper = humanoid.getNormalizedBoneNode?.('rightUpperArm')
        || humanoid.getRawBoneNode?.('rightUpperArm');
      const rightLower = humanoid.getNormalizedBoneNode?.('rightLowerArm')
        || humanoid.getRawBoneNode?.('rightLowerArm');
      if (!leftUpper || !leftLower || !rightUpper || !rightLower) return false;

      const left = leftUpper.worldToLocal(leftLower.getWorldPosition(new THREE.Vector3()));
      const right = rightUpper.worldToLocal(rightLower.getWorldPosition(new THREE.Vector3()));
      return left.x > 0.001 && right.x < -0.001;
    }

    function updateHud() {
      timeReadout.textContent = `${elapsed.toFixed(1)}s`;
      emotionReadout.textContent = presence?.emotion || 'neutral';
      gestureReadout.textContent = lastGesture;
      window.__avatarPoseHarness.stats = {
        elapsed,
        emotion: presence?.emotion || 'neutral',
        gesture: lastGesture,
        avatarFile,
      };
    }

    function animate(now = performance.now()) {
      frameId = requestAnimationFrame(animate);
      const dt = Math.min((now - lastT) / 1000, 0.1);
      lastT = now;
      elapsed += dt;

      if (presence && animator) {
        presence.update(dt);

        const gesture = presence.consumeGesture() || presence.consumeIdleAction();
        if (gesture) {
          lastGesture = gesture;
          animator.triggerGesture(gesture);
        }

        animator.setBreathModifier(presence.breathModifier);
        animator.setEmotion(presence.emotion);
        animator.update(dt, {
          speaking: false,
          processing: false,
          userSpeaking: presence.flow < -0.3,
          rms: 0,
          visemes: {},
        });
      } else if (vrm?.update) {
        vrm.update(dt);
      }

      renderer.render(scene, camera);
      updateHud();
    }

    async function main() {
      resize();
      window.addEventListener('resize', resize);

      vrm = await loadVRM(avatarUrl);
      scene.add(vrm.scene);
      vrm.update?.(0);

      const box = new THREE.Box3().setFromObject(vrm.scene);
      framing = { box };
      applyFullBodyFrame(box);

      animator = new AvatarAnimator(THREE, vrm);
      presence = new PresenceEngine();
      loading.classList.add('hidden');

      window.__avatarPoseHarness.ready = true;
      lastT = performance.now();
      animate(lastT);
    }

    main().catch((error) => {
      console.error(error);
      loading.textContent = `Failed to load avatar: ${error?.message || error}`;
      window.__avatarPoseHarness.error = String(error?.message || error);
    });

    window.addEventListener('beforeunload', () => {
      if (frameId) cancelAnimationFrame(frameId);
      try { animator?.dispose?.(); } catch {}
      try { presence?.dispose?.(); } catch {}
      try { renderer?.dispose?.(); } catch {}
    });
  </script>
</body>
</html>
