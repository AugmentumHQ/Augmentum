<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Augmentum</title>
  <link rel="stylesheet" href="cast-home.css">
</head>
<body>
  <!-- Layered backdrop: low-saturation art behind a dark scrim so
       typography always reads. The cycling layer fades between
       library backdrops; the static layer is the always-there
       gradient base. -->
  <div class="bg-base" aria-hidden="true"></div>
  <div class="bg-cycle" data-cs-backdrop aria-hidden="true"></div>
  <div class="bg-scrim" aria-hidden="true"></div>

  <main class="home">
    <header class="masthead">
      <div class="brand">
        <!-- Orbiting-orbs glyph — same SVG geometry as the main app's
             header-logo-glyph (three rings + a core, animateMotion-
             driven orbs). Sized for 10-foot TV viewing via the
             .brand-glyph class in cast-home.css. -->
        <svg class="brand-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <defs>
            <radialGradient id="cast-logo-narr" cx="35%" cy="30%">
              <stop offset="0%" stop-color="var(--orb-narrative-hi)"/>
              <stop offset="55%" stop-color="var(--orb-narrative)"/>
              <stop offset="100%" stop-color="var(--orb-narrative-lo)"/>
            </radialGradient>
            <radialGradient id="cast-logo-anal" cx="35%" cy="30%">
              <stop offset="0%" stop-color="var(--orb-analytical-hi)"/>
              <stop offset="55%" stop-color="var(--orb-analytical)"/>
              <stop offset="100%" stop-color="var(--orb-analytical-lo)"/>
            </radialGradient>
            <radialGradient id="cast-logo-pass" cx="35%" cy="30%">
              <stop offset="0%" stop-color="var(--orb-passthrough-hi)"/>
              <stop offset="55%" stop-color="var(--orb-passthrough)"/>
              <stop offset="100%" stop-color="var(--orb-passthrough-lo)"/>
            </radialGradient>
            <radialGradient id="cast-logo-core" cx="35%" cy="30%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#f1d6a6"/>
              <stop offset="100%" stop-color="var(--accent)"/>
            </radialGradient>
          </defs>
          <!-- Three orbit rings. Parent <g> rotation tilts each plane;
               JS in cast-home.js drives the orb cx/cy each frame because
               Chromium's SMIL animateMotion is unreliable inside
               transformed groups. -->
          <g transform="rotate(-22 12 12)" class="aug-logo-ring">
            <ellipse cx="12" cy="12" rx="10" ry="3.4"
                     stroke="var(--orb-narrative)" stroke-width="0.5" opacity="0.45"/>
            <circle r="1.7" fill="url(#cast-logo-narr)" class="aug-logo-orb"
                    data-cs-orb="narr" cx="22" cy="12"/>
          </g>
          <g transform="rotate(28 12 12)" class="aug-logo-ring" style="animation-delay:.7s">
            <ellipse cx="12" cy="12" rx="8" ry="2.6"
                     stroke="var(--orb-analytical)" stroke-width="0.5" opacity="0.45"/>
            <circle r="1.5" fill="url(#cast-logo-anal)" class="aug-logo-orb"
                    data-cs-orb="anal" cx="20" cy="12"/>
          </g>
          <g transform="rotate(70 12 12)" class="aug-logo-ring" style="animation-delay:1.4s">
            <ellipse cx="12" cy="12" rx="6" ry="2"
                     stroke="var(--orb-passthrough)" stroke-width="0.5" opacity="0.45"/>
            <circle r="1.3" fill="url(#cast-logo-pass)" class="aug-logo-orb"
                    data-cs-orb="pass" cx="18" cy="12"/>
          </g>
          <circle cx="12" cy="12" r="2.2" fill="url(#cast-logo-core)" class="aug-logo-core"/>
        </svg>
        <span class="brand-name">Augmentum</span>
      </div>
      <div class="clock" data-cs-clock>
        <div class="clock-time" data-cs-time>—:—</div>
        <div class="clock-date" data-cs-date>—</div>
      </div>
    </header>

    <!-- Rails are generated dynamically from the server's
         /api/cast/library/home response so the TV reflects whatever
         rails the user has visible on this receiver. Hidden rails
         (toggled off in cast-control) are filtered server-side via
         the receiver's trusted_id; this DOM holds whatever's left. -->
    <div class="rails" data-cs-rails-host></div>

    <footer class="colophon">
      <span class="colophon-status" data-cs-status>Listening for casts.</span>
      <span class="colophon-hint">Cast from your phone or laptop.</span>
    </footer>
  </main>

  <script type="module" src="cast-home.js"></script>
</body>
</html>
