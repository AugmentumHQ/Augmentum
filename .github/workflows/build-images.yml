name: build-images

# Builds and publishes the CPU and GPU container variants to GHCR.
#
# Triggers:
#   - push to main: rebuilds :cpu-latest and :gpu-latest
#   - tags v*    : rebuilds and also tags the version (:cpu-vX.Y.Z, :gpu-vX.Y.Z)
#   - manual     : workflow_dispatch with optional skip flags
#
# Build chain (DECOUPLED per variant so a CPU release never waits on the slow
# CUDA build — most users are CPU):
#   llama-server-cpu  →  augmentum-cpu   (Dockerfile,     FROMs augmentum-llama-server-cpu)
#   llama-server-gpu  →  augmentum-gpu   (Dockerfile.gpu, FROMs augmentum-llama-server)
#   sidecars (executor, agent-browser)   — independent
#
# The llama-server images only rebuild when LLAMA_SERVER_VERSION changes, so the
# re-runs are cheap on cached layers.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'Dockerfile.gpu'
      - 'Dockerfile.llama-server'
      - 'Dockerfile.llama-server-cpu'
      - 'pyproject.toml'
      - 'augmentum/**'
      - 'ui/**'
      - 'config/**'
      - 'entrypoint.sh'
      - '.github/workflows/build-images.yml'
      - 'LLAMA_SERVER_VERSION'
      - 'executor/**'
      - 'Dockerfile.browser'
      - 'AGENT_BROWSER_VERSION'
  workflow_dispatch:
    inputs:
      skip_llama_server:
        description: 'Skip llama-server builds (reuse existing GHCR images)'
        required: false
        default: false
        type: boolean

# Cancel a superseded in-flight run on the same ref so rapid pushes don't stack
# redundant (slow, CUDA) builds. A tag build gets its own group so it's never
# cancelled by a subsequent branch push.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Org name lowercased — GHCR rejects uppercase chars in image refs.
  ORG: augmentumhq

jobs:
  # --------------------------------------------------------------------------
  # llama-server — CPU and GPU as SEPARATE jobs so each augmentum variant can
  # depend on only its own sibling (the CPU image doesn't wait on the CUDA build).
  # Built once per LLAMA_SERVER_VERSION bump; cheap on cached layers otherwise.
  # --------------------------------------------------------------------------
  llama-server-cpu:
    if: ${{ !inputs.skip_llama_server }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned llama.cpp version
        id: llama_ver
        run: echo "version=$(cat LLAMA_SERVER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push CPU llama-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.llama-server-cpu
          push: true
          # amd64-only for launch. When arm64 lands, this must go multi-arch too
          # so the CPU augmentum image (which FROMs it) can build a native arm64 leg.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server-cpu:${{ steps.llama_ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server-cpu:latest
          build-args: |
            LLAMA_CPP_VERSION=${{ steps.llama_ver.outputs.version }}
          cache-from: type=gha,scope=llama-server-cpu
          cache-to: type=gha,scope=llama-server-cpu,mode=max

  llama-server-gpu:
    if: ${{ !inputs.skip_llama_server }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned llama.cpp version
        id: llama_ver
        run: echo "version=$(cat LLAMA_SERVER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push GPU llama-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.llama-server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server:${{ steps.llama_ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server:latest
          build-args: |
            LLAMA_CPP_VERSION=${{ steps.llama_ver.outputs.version }}
          cache-from: type=gha,scope=llama-server-gpu
          cache-to: type=gha,scope=llama-server-gpu,mode=max

  # --------------------------------------------------------------------------
  # Augmentum CPU — depends ONLY on llama-server-cpu, so it publishes as soon as
  # the CPU chain is done, regardless of the (slow) GPU build.
  # --------------------------------------------------------------------------
  augmentum-cpu:
    runs-on: ubuntu-latest
    needs: [llama-server-cpu]
    # Run even when llama-server-cpu was skipped (workflow_dispatch reuse path);
    # only bail if it actually failed.
    if: ${{ always() && needs.llama-server-cpu.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned llama.cpp version
        id: llama_ver
        run: echo "version=$(cat LLAMA_SERVER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:cpu-${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:cpu-latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            tags="$tags,${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:cpu-${version}"
          fi
          echo "tags=$tags" >> $GITHUB_OUTPUT
      - name: Build & push CPU variant
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64-only for the initial launch. arm64 (Apple Silicon / ARM Linux)
          # is a planned fast-follow: flip to `linux/amd64,linux/arm64` once a real
          # arm64 build is watched green (the QEMU step above stays for that).
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            LLAMA_SERVER_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server-cpu:${{ steps.llama_ver.outputs.version }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,scope=cpu,mode=max

  # --------------------------------------------------------------------------
  # Augmentum GPU — depends ONLY on llama-server-gpu. NVIDIA CUDA has no arm64
  # equivalent here, so amd64-only.
  # --------------------------------------------------------------------------
  augmentum-gpu:
    runs-on: ubuntu-latest
    needs: [llama-server-gpu]
    if: ${{ always() && needs.llama-server-gpu.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned llama.cpp version
        id: llama_ver
        run: echo "version=$(cat LLAMA_SERVER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:gpu-${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:gpu-latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            tags="$tags,${{ env.REGISTRY }}/${{ env.ORG }}/augmentum:gpu-${version}"
          fi
          echo "tags=$tags" >> $GITHUB_OUTPUT
      - name: Build & push GPU variant
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            LLAMA_SERVER_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/augmentum-llama-server:${{ steps.llama_ver.outputs.version }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,scope=gpu,mode=max

  # --------------------------------------------------------------------------
  # Sidecar images — the code executor and the agent-browser. Independent of
  # the llama-server/augmentum chain (run in parallel), built whenever their
  # sources change so users PULL these prebuilt instead of compiling the
  # scientific-Python wheels / the slow, drifting Chromium build on first run.
  # --------------------------------------------------------------------------
  sidecars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: executor
            package: augmentum-executor
            context: ./executor
            dockerfile: Dockerfile
            scope: executor
            platforms: linux/amd64   # arm64 deferred to a post-launch fast-follow
          - name: agent-browser
            package: augmentum-agent-browser
            context: .
            dockerfile: Dockerfile.browser
            scope: agent-browser
            platforms: linux/amd64   # arm64 deferred to a post-launch fast-follow
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read agent-browser pin
        id: ab_ver
        run: echo "version=$(cat AGENT_BROWSER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Compute tags
        id: tags
        run: |
          base="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.package }}"
          tags="$base:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags,$base:latest"
          fi
          # agent-browser also gets its vendored-binary version tag (the
          # pin that actually changes its contents), mirroring llama-server.
          if [ "${{ matrix.name }}" = "agent-browser" ]; then
            tags="$tags,$base:${{ steps.ab_ver.outputs.version }}"
          fi
          echo "tags=$tags" >> $GITHUB_OUTPUT

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            AGENT_BROWSER_VERSION=${{ steps.ab_ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
