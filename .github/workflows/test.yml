name: test

# Server-side test + lint CI. Mirrors what `pytest tests/ -q` and
# `ruff check augmentum/` do locally.
#
# The README has long claimed "exercised on x86_64 Linux (CI)" — this
# workflow makes that claim load-bearing instead of aspirational. The
# matrix is intentionally narrow (one Linux, one Python) because the
# heavy deps (torch / onnxruntime / fastembed) make a fan-out matrix
# painfully slow on free runners.
#
# Triggers:
#   - push to main / tags v*: full run
#   - PR to main:             full run
#   - workflow_dispatch:      manual button

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install --no-cache-dir 'ruff==0.8.6'
      - name: ruff check
        run: ruff check augmentum/ tests/

  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      # System deps that some of our pip packages need to import on Linux:
      # - ffmpeg: torchaudio / pydub backends look for it at import
      # - libsndfile1: soundfile needs it
      # - espeak-ng-data: espeakng-loader uses this when bundled lib is
      #   absent on weird hosts (CI Ubuntu has it)
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsndfile1 espeak-ng-data

      # Install with the dev extra so pytest / pytest-asyncio / pytest-httpx
      # / respx are available. Hash-locked install isn't used here because
      # the dev extras + image-cpu set is wider than requirements.lock
      # carries (requirements.lock is the production-image manifest).
      - name: pip install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the explicitly-offline subset. Tests marked `live` (against
      # a running services stack) and `slow` (heavy benchmarks) are
      # deselected — those need a richer environment than CI provides.
      - name: pytest
        run: |
          pytest tests/ -q \
            -m "not live and not slow" \
            --junitxml=pytest-junit.xml

      - name: Upload pytest junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: pytest-junit.xml
          retention-days: 7
