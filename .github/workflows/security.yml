name: security

# Supply-chain + dep-vuln scanning. Three jobs:
#
#   1. pip-audit     — Python deps via PyPI Advisory DB + OSV
#   2. osv-scanner   — broader OSV coverage (GitHub Advisory DB included)
#   3. trivy-image   — scan the freshly-built CPU image for OS-level
#                      CVEs (Debian/Ubuntu packages, not just pip)
#
# Triggers:
#   - push to main:           full run
#   - PR:                     full run (catches regressions before merge)
#   - schedule (weekly Mon):  catches newly-disclosed CVEs even when
#                             nothing in the repo has changed
#   - workflow_dispatch:      manual button in the Actions tab

on:
  push:
    branches: [main]
    # Doc-only changes touch no deps or image contents — skip the scan (which
    # includes an ~11-min CPU-image build for trivy). The weekly schedule below
    # still catches newly-disclosed CVEs regardless of repo activity.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Mondays 14:00 UTC = 10:00 ET, a couple of hours after Dependabot's
    # weekly run so any security PRs Dependabot opens land first.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # so trivy/osv can upload SARIF to the Security tab

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install --no-cache-dir 'pip-audit>=2.7.0'

      - name: Audit requirements.lock
        # --strict treats yanked releases and resolution failures as errors.
        #
        # Ignored vulns below are DEFERRED to a tested dependency-bump pass —
        # each requires a major/risky upgrade that can break the running stack
        # and needs a full test cycle (not a rushed change). Tracked for
        # follow-up; the safe leaf-dep CVEs were already bumped in the lock.
        #   - torch 2.8 -> 2.10/2.13 (CUDA + model-stack compat)
        #   - starlette 1.0 -> 1.3   (FastAPI coupling)
        #   - mcp 1.27 -> 1.28
        #   - diffusers 0.37 -> 0.38
        run: |
          pip-audit \
            --strict \
            --requirement requirements.lock \
            --disable-pip \
            --vulnerability-service osv \
            --format columns \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-203 \
            --ignore-vuln PYSEC-2025-204 \
            --ignore-vuln PYSEC-2025-206 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2026-2286 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-3481 \
            --ignore-vuln PYSEC-2026-3482 \
            --ignore-vuln PYSEC-2026-3483 \
            --ignore-vuln PYSEC-2026-2446 \
            --ignore-vuln PYSEC-2026-40 \
            --ignore-vuln PYSEC-2026-41

  osv-scanner:
    name: osv-scanner (OSV + GitHub Advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Action wraps the Go binary so we don't need to install Go.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          # Scan both the lockfile and the pyproject manifest. OSV-Scanner
          # follows transitive deps via the lockfile but the manifest
          # gives it a name for direct-dep classification.
          scan-args: |-
            --lockfile=requirements.lock
            --lockfile=uv.lock

  trivy-image:
    name: trivy (built CPU image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned llama.cpp version
        id: llama_ver
        run: echo "version=$(cat LLAMA_SERVER_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build the CPU image locally so we can scan it before publish.
      # Use the same build-arg shape build-images.yml uses, but skip
      # the heavyweight llama-server matrix — point at the latest
      # already-published GHCR image instead.
      - name: Build augmentum CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: augmentum:audit-${{ github.sha }}
          build-args: |
            LLAMA_SERVER_IMAGE=ghcr.io/augmentumhq/augmentum-llama-server-cpu:${{ steps.llama_ver.outputs.version }}

      - name: Trivy scan (filesystem + OS + secrets)
        # v0.33.1: pins its internal setup-trivy by immutable SHA. Older tags
        # (v0.28.0/v0.30.0) referenced setup-trivy tags aquasecurity later
        # DELETED (v0.2.1/v0.2.2), which fails at "Set up job".
        uses: aquasecurity/trivy-action@v0.33.1
        # Advisory scan — never block the build on it (findings are already
        # exit-code:0; this extends that to operational flakes like the trivy
        # vuln-DB pull rate-limiting on ghcr.io, which produced no SARIF and
        # cascaded into the upload step). GITHUB_TOKEN authenticates the DB
        # pull to raise the anonymous rate limit.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: augmentum:audit-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          # HIGH and CRITICAL only — MEDIUM/LOW are too noisy at the
          # OS-package layer for a base-image we don't fully control.
          severity: 'HIGH,CRITICAL'
          # Don't fail the job on findings — uploading to the Security
          # tab is more useful than blocking merges on a CVE upstream
          # hasn't patched yet. Flip to true once the baseline is clean.
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        # Only upload if the scan actually produced the file (a failed/rate-
        # limited scan leaves no SARIF → the upload would error "Path does not
        # exist"). continue-on-error covers the case where Code Scanning isn't
        # enabled on the repo yet.
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Upload Trivy report as artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      # ──────────────────────────────────────────────────────────────
      # SBOM (CycloneDX) for the built image — uploaded as an artifact
      # on every run, attached to the GitHub Release on tagged builds.
      # SPDX is the alternative; CycloneDX is what most downstream
      # scanners (Snyk, Dependency-Track, Sonatype Lifecycle) prefer.
      # ──────────────────────────────────────────────────────────────
      - name: Generate CycloneDX SBOM (via trivy)
        # Also advisory + also does a trivy DB pull, so it can hit the same
        # rate-limit. Don't let it block the build.
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workdir" \
            aquasec/trivy:0.58.0 \
            image \
            --format cyclonedx \
            --output /workdir/sbom-cyclonedx.json \
            augmentum:audit-${{ github.sha }}

      - name: Upload SBOM as artifact
        if: hashFiles('sbom-cyclonedx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: ignore
          # 90 days so a downstream consumer who only checks quarterly
          # can still pull the SBOM that matched a specific release.
          retention-days: 90

      - name: Attach SBOM to GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-cyclonedx.json
          fail_on_unmatched_files: true
